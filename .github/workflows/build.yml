name: Build HookCrashers ASI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x86 ASI
    runs-on: windows-2022
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      HC_CHANNEL: ${{ github.event_name == 'push' && github.ref_name == 'main' && 'release' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve semantic version
        id: version
        shell: pwsh
        run: |
          $base = (Get-Content VERSION -Raw).Trim()
          if ($base -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION: $base" }
          $version = if ($env:HC_CHANNEL -eq 'release') { $base } else { "$base-dev" }
          "HC_VERSION=$version" >> $env:GITHUB_ENV
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Checkout Detours
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/Detours.git External/detours

      - name: Checkout Dear ImGui
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/ocornut/imgui.git External/imgui

      - name: Checkout Lua 5.4.7
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\External\lua54\lua-5.4.7 | Out-Null
          git clone --depth 1 --branch v5.4.7 https://github.com/lua/lua.git ..\External\lua54\lua-5.4.7\src

      - name: Build Detours x86
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VSINSTALL=%%i
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cd /d "%GITHUB_WORKSPACE%\External\detours"
          nmake

      - name: Build HookCrashers
        shell: cmd
        run: |
          msbuild HookCrashers.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:HookCrashersVersion=%HC_VERSION% /p:HookCrashersChannel=%HC_CHANNEL%

      - name: Package v5 drop-in build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path dist/mods | Out-Null
          Copy-Item Release/HookCrashers.asi dist/HookCrashers.asi
          # Ship an empty mods folder: any folder mod switches saves to hc_<mod>.dat,
          # so example mods (examples/mods) are never installed for players.
          Set-Content dist/mods/README.txt "Put HookCrashers folder mods here (one folder per mod). See https://github.com/lorizz/hookcrashers#folder-mods"

          gh release download v9.7.2 `
            --repo ThirteenAG/Ultimate-ASI-Loader `
            --pattern Ultimate-ASI-Loader.zip `
            --dir External/ultimate-asi-loader `
            --clobber
          Expand-Archive External/ultimate-asi-loader/Ultimate-ASI-Loader.zip External/ultimate-asi-loader/x86 -Force
          Copy-Item External/ultimate-asi-loader/x86/dinput8.dll dist/dinput8.dll

          Compress-Archive -Path dist/HookCrashers.asi,dist/dinput8.dll,dist/mods -DestinationPath HookCrashers-v5-dropin.zip -Force

      - name: Package and verify C++ SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force sdk-package/sdk/lib,sdk-package/examples/native,sdk-package/docs | Out-Null
          Copy-Item sdk/* sdk-package/sdk -Recurse -Force
          Copy-Item Release/HookCrashers.lib sdk-package/sdk/lib/HookCrashers.lib -Force
          Copy-Item examples/native/* sdk-package/examples/native -Recurse
          Copy-Item docs/current-character-api.md sdk-package/docs/current-character-api.md
          Set-Content sdk-package/VERSION.txt $env:HC_VERSION
          $stage = (Resolve-Path sdk-package).Path
          msbuild sdk-package/examples/native/CharacterLevelWatch/CharacterLevelWatch.vcxproj /m /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 "/p:OutDir=$stage/../sdk-smoke/bin/" "/p:IntDir=$stage/../sdk-smoke/obj/"
          if ($LASTEXITCODE -ne 0) { throw "Packaged SDK example failed to link" }
          Compress-Archive -Path sdk-package/* -DestinationPath HookCrashers-SDK-Win32.zip -Force

      - name: Upload ASI artifact
        uses: actions/upload-artifact@v4
        with:
          name: HookCrashers-v5-win32
          path: |
            dist/HookCrashers.asi
            dist/dinput8.dll
            dist/mods/**
            HookCrashers-v5-dropin.zip
            HookCrashers-SDK-Win32.zip
          if-no-files-found: error

  publish-channel:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    # Channels: a push to main publishes the stable release; a push to any other
    # branch publishes the dev build (testing channel). Pull requests, forks and
    # commits whose message contains [skip ci] only build or do not run at all.
    if: github.event_name == 'push' && github.repository_owner == 'lorizz'
    permissions:
      contents: write
    # One publish per channel at a time: concurrent pushes to two dev branches
    # would otherwise race on the shared "dev" release.
    concurrency:
      group: publish-${{ github.ref_name == 'main' && 'stable' || 'dev' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      HC_STABLE: ${{ github.ref_name == 'main' && 'true' || 'false' }}
      HC_CHANNEL: ${{ github.ref_name == 'main' && 'release' || 'dev' }}
      HC_MANIFEST: ${{ github.ref_name == 'main' && 'stable.json' || 'testing.json' }}
      HC_VERSION: ${{ needs.build.outputs.version }}
      HC_TAG: ${{ github.ref_name == 'main' && format('release_{0}', needs.build.outputs.version) || 'dev' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: HookCrashers-v5-win32
          path: artifact

      - name: Skip already released stable versions
        id: guard
        shell: bash
        run: |
          if [ "${HC_STABLE}" = "true" ] && gh release view "${HC_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::warning::${HC_TAG} already exists; nothing published. Bump VERSION to release a new stable build."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare manifest, checksums and release notes
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${HC_TAG}"
          mkdir -p upload
          cp artifact/HookCrashers-v5-dropin.zip artifact/HookCrashers-SDK-Win32.zip \
             artifact/dist/HookCrashers.asi artifact/dist/dinput8.dll upload/
          (cd upload && sha256sum HookCrashers.asi dinput8.dll HookCrashers-v5-dropin.zip HookCrashers-SDK-Win32.zip > SHA256SUMS.txt)
          asset_sha="$(sha256sum upload/HookCrashers.asi | cut -d' ' -f1)"

          # Read by the in-game updater (src/Core/Version.h). Only builds from
          # this repository's releases with a matching SHA-256 are installed.
          cat > "upload/${HC_MANIFEST}" <<EOF
          {
            "name": "HookCrashers",
            "channel": "${HC_CHANNEL}",
            "version": "${HC_VERSION}",
            "commit": "${GITHUB_SHA}",
            "asset_url": "${base}/HookCrashers.asi",
            "asset_sha256": "${asset_sha}",
            "dropin_url": "${base}/HookCrashers-v5-dropin.zip",
            "sdk_url": "${base}/HookCrashers-SDK-Win32.zip",
            "notes": "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${HC_TAG}"
          }
          EOF

          if [ "${HC_STABLE}" = "true" ]; then
            changes="$(awk -v v="${HC_VERSION}" '$0 ~ "^## "v"( |$)" { seen=1; next } /^## / { if (seen) exit } seen { print }' CHANGELOG.md)"
            if [ -z "${changes//[[:space:]]/}" ]; then
              echo "::error::CHANGELOG.md has no '## ${HC_VERSION}' section; add it before releasing."
              exit 1
            fi
          else
            changes="$(awk '/^## / { if (seen) exit; seen=1; next } seen { print }' CHANGELOG.md)"
          fi

          {
            if [ "${HC_STABLE}" = "true" ]; then
              echo "Stable release. Installed copies update themselves on the next launch."
            else
              echo "> **Development build** from \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`), published to the testing channel only."
              echo "> It may be unfinished; keep a backup of your saves."
            fi
            echo
            echo "## Install"
            echo
            echo "1. Download **HookCrashers-v5-dropin.zip** and extract it into the Castle Crashers folder (the one containing \`castle.exe\`)."
            echo "2. Start the game once. HookCrashers creates \`HookCrashers.yaml\` and the \`mods\` folder."
            echo
            echo "Requires the current Steam build of Castle Crashers Remastered (\`castle.exe\` timestamp \`0x6A4D42BF\`)."
            echo
            echo "## Changes"
            echo
            echo "${changes}"
            echo
            echo "## Files"
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            while read -r hash file; do echo "| \`${file}\` | \`${hash}\` |"; done < upload/SHA256SUMS.txt
            echo
            echo "Native mod authors: **HookCrashers-SDK-Win32.zip** contains the headers, import library, examples and \`QUICKSTART-ASI.md\`."
          } > release-notes.md

      - name: Publish release
        if: steps.guard.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${HC_STABLE}" = "true" ]; then
            title="HookCrashers ${HC_VERSION}"
            flags=(--latest)
          else
            # The dev release is recreated on every push and never becomes "latest",
            # which is what the stable channel manifest URL resolves to.
            gh release delete "${HC_TAG}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true
            title="HookCrashers ${HC_VERSION} (dev, ${GITHUB_REF_NAME})"
            flags=(--prerelease --latest=false)
          fi
          gh release create "${HC_TAG}" upload/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${title}" \
            --notes-file release-notes.md \
            --target "${GITHUB_SHA}" \
            "${flags[@]}"
